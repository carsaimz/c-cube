name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # nunca cancelar um build de release

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo → versionCode = nº de commits

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build estático do Next (assets web para o Capacitor)
        run: bun run build:static

      - name: Sincronizar Capacitor (copiar assets + plugins)
        run: bunx cap sync android

      - name: Configurar assinatura (secrets opcionais)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_B64" | base64 -d > android/keystore/release.jks
            printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/keystore.properties
            echo "✅ Assinatura configurada a partir dos secrets."
          else
            echo "⚠️ Sem secrets de assinatura — o release sairá NÃO assinado."
          fi

      - name: Determinar versão (da tag)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build APK + AAB (release)
        run: >
          cd android && ./gradlew assembleRelease bundleRelease
          -PversionCode=$(git rev-list --count HEAD)
          -PversionName=${VERSION}
          --stacktrace

      - name: Organizar artefactos
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/*.apk   "output/C-Cube-${VERSION}.apk"
          cp android/app/build/outputs/bundle/release/*.aab "output/C-Cube-${VERSION}.aab"

      - name: Carregar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: output/*
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pattern: release/C-Cube-Setup-*.exe
          - os: ubuntu-latest
            pattern: release/C-Cube-*.AppImage
          - os: macos-latest
            pattern: release/C-Cube-*.dmg
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # sem certificados Apple no CI
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # Alinhar a versão do instalador com a tag (v1.2.3 → 1.2.3)
      - name: Alinhar versão com a tag
        shell: bash # necessário no Windows (expansão ${VAR#v})
        run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version --allow-same-version

      - name: Build estático do Next (assets web para o Electron)
        run: bun run build:static

      - name: Empacotar com electron-builder
        run: bunx electron-builder --publish never

      - name: Carregar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.os }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publicar GitHub Release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar todos os artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Listar artefactos finais
        run: ls -lah dist

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
